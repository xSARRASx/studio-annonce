# Publie le site (dossier web/) sur GitHub Pages à chaque push sur main.
# Réglage à faire une fois : Settings > Pages > Source = "GitHub Actions".
name: Site sur GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "mobile/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "web/package-lock.json\nmobile/package-lock.json" }
      - run: npm ci
      - run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: /studio-annonce
          # Adresse du cerveau : à renseigner dans Settings > Secrets and variables > Actions > Variables (API_URL)
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_MOBILE_URL: /studio-annonce/mobile
      # L'appli mobile (Expo) en version web, publiée dans /mobile à côté du site
      - run: npm ci && npx expo export --platform web --output-dir dist
        working-directory: mobile
        env:
          EXPO_BASE_URL: /studio-annonce/mobile
          CI: "1"
      - run: cp -R ../mobile/dist out/mobile
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/out }

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
